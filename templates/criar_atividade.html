{% extends "base.html" %}

{% block title %}Nova atividade - NeuroLearn{% endblock %}

{% block content %}
<section class="nl-auth">
    <div>
        <div class="nl-eyebrow">Educador · atividade</div>
        <h1 class="mt-2">Crie uma atividade observavel.</h1>
        <p class="nl-lead">Atividades ajudam a reunir evidencias de aprendizagem sem transformar a plataforma em instrumento diagnostico.</p>
    </div>
    <form class="nl-card nl-card-feature" method="post" enctype="multipart/form-data">
        <div class="mb-3"><label class="form-label">Titulo</label><input class="form-control" name="titulo" required></div>
        <div class="mb-3"><label class="form-label">Descricao</label><textarea class="form-control" name="descricao" rows="4" required></textarea></div>
        <div class="nl-grid nl-grid-2">
            <div><label class="form-label">Tipo</label><input class="form-control" name="tipo" placeholder="logica, memoria, linguagem..." required></div>
            <div><label class="form-label">Data limite</label><input class="form-control" name="data_limite" type="date"></div>
            <div><label class="form-label">Pontuacao maxima</label><input class="form-control" name="pontuacao_maxima" type="number" value="100"></div>
            <div><label class="form-label">Anexo</label><input class="form-control" name="arquivo" type="file"></div>
        </div>
        <div class="mt-3"><label class="form-label">Instrucoes especiais</label><textarea class="form-control" name="instrucoes_especiais" rows="3"></textarea></div>
        <button class="btn btn-primary w-100 mt-4" type="submit">Publicar atividade</button>
    </form>
</section>
{% endblock %}
